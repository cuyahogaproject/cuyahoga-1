name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch or pull request cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    # The .NET SDK, SQL Server LocalDB, Node.js and the .NET Framework 4.8 targeting pack (for the net48 unit tests)
    # come with the image.
    runs-on: windows-2025
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.*') }}
          restore-keys: nuget-${{ runner.os }}-

      # Fails fast, before the build, when the runner image lacks a tool that the build or the e2e tests need.
      - name: Check tools
        run: |
          $missing = @()
          foreach ($tool in 'dotnet', 'sqlcmd', 'SqlLocalDB') {
            $command = Get-Command $tool -ErrorAction SilentlyContinue
            if ($command) { "${tool}: $($command.Source)" } else { $missing += "$tool (not on PATH)" }
          }
          if ($missing) {
            $missing | ForEach-Object { "::error::Missing tool: $_" }
            exit 1
          }

      - name: Build
        run: dotnet build Cuyahoga.sln -c Debug -v minimal

      - name: Unit tests (net48)
        run: Tests/Cuyahoga.Core.Tests/bin/Debug/net48/Cuyahoga.Core.Tests.exe

      # Cuyahoga.Core is netstandard2.0: test it on .NET 10 as well.
      - name: Unit tests (net10.0)
        run: dotnet Tests/Cuyahoga.Core.Tests/bin/Debug/net10.0/Cuyahoga.Core.Tests.dll

      - name: Unit tests of the ASP.NET Core site
        run: dotnet Tests/Cuyahoga.Web.Core.Tests/bin/Debug/net10.0/Cuyahoga.Web.Core.Tests.dll

      # End-to-end tests on SQL Server (LocalDB). MySQL and PostgreSQL are tested locally (npm run test:all).

      - name: Start SQL Server LocalDB
        run: |
          SqlLocalDB start MSSQLLocalDB
          sqlcmd -S "(localdb)\MSSQLLocalDB" -E -b -Q "SELECT @@VERSION"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install chromium

      - name: End-to-end tests
        working-directory: e2e
        run: npm run test:mssql

      - name: Upload e2e report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14

      - name: Upload e2e traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: e2e/test-results
          retention-days: 14
